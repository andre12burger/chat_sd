<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Multiusuário - Sistemas Distribuídos</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module">
        import { EmojiButton } from 'https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4/dist/index.js';
        window.EmojiButton = EmojiButton;
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat Multiusuário</h1>
            <p>Sistemas Distribuídos - Prof. Bruno Dalmazo</p>
            <div class="status-panel">
                <span class="status-label">Status:</span>
                <span id="userStatus" class="status-dot online">Online</span>
                <span class="status-note">Use <code>/status online</code>, <code>/status away</code>, <code>/status busy</code> ou <code>/nudge</code></span>
            </div>
        </div>
        
        <div class="login-section" id="loginSection">
            <input type="text" id="usernameInput" placeholder="Digite seu username..." maxlength="20">
            <button id="connectBtn" onclick="connect()">Conectar</button>
        </div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="tools-section" id="toolsSection" style="display: none;">
            <button id="emojiPickerBtn" type="button" onclick="openEmojiPicker()">Emoji</button>
            <button id="gifToggleBtn" type="button" onclick="toggleGifPicker()">GIF</button>
            <span class="hint">Markdown: **negrito**, *itálico*, ~~riscado~~ · Emoji: :smile: :thumbsup:</span>
        </div>

        <div class="gif-picker" id="gifPicker" style="display: none;">
            <div class="gif-search">
                <input type="text" id="gifSearchInput" placeholder="Buscar GIFs..." autocomplete="off">
                <button type="button" onclick="searchGifs()">Buscar</button>
            </div>
            <div class="gif-results" id="gifResults"></div>
        </div>
        
        <div class="input-section" id="inputSection" style="display: none;">
            <input type="text" id="messageInput" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
        
        <div class="status" id="status">Desconectado</div>
    </div>
    
    <script src="client_app.js"></script>
</body>
</html>
